<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="81" height="81" rx="20.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Orbital Ring -->
  <ellipse cx="50" cy="50" rx="28" ry="12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" transform="rotate(-30 50 50)"/>

  <!-- Soundwave / Speech Bars -->
  <line x1="32" y1="50" x2="32" y2="50" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="38" y1="44" x2="38" y2="56" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="62" y1="44" x2="62" y2="56" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Central AI Sparkle Star -->
  <path d="M50 28 C50 38 40 48 28 50 C40 52 50 62 50 72 C50 62 60 52 72 50 C60 48 50 38 50 28 Z" fill="url(#glowGrad)"/>
  
  <!-- Core Star Glow Core -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff"/>
</svg>

